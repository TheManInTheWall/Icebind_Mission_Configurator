name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build v1 (repository root)
      - name: Install v1 dependencies
        run: npm ci

      - name: Build v1
        run: npm run build

      # Build v2 (separate project in /v2)
      - name: Install v2 dependencies
        run: npm ci --prefix v2

      - name: Build v2
        run: npm run build --prefix v2

      # Copy v2 into the v1 deployment output
      - name: Combine builds
        run: |
          mkdir -p dist/v2
          cp -a v2/dist/. dist/v2/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
